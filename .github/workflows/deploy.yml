name: Save File Artifact

on:
  push:
    branches:
      - main

jobs:
  create-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create a file
        run: |
          mkdir -p output
          echo "Hello from GitHub Actions" > output/message.txt
          echo "This file is stored as an artifact." >> output/message.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: output/message.txt

  download-and-read:
    runs-on: ubuntu-latest
    needs: create-file

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          path: downloaded

      - name: Read artifact file
        run: |
          echo "Reading artifact content:"
          cat downloaded/message.txt